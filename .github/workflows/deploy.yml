name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  ECR_REPO: github-agent

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
            agent/package-lock.json
            website/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Install infra deps
        run: cd infra && npm ci

      - name: Validate infra
        run: |
          cd infra
          npm run build
          npm test

      - name: Validate agent shell scripts
        run: |
          cd agent
          npm ci
          npm run build
          bash -n entrypoint.sh
          bash -n review-entrypoint.sh
          bash -n lib/common.sh
          bash -n lib/orchestrate-lint.sh
          bash -n lib/lint-loop.sh

      - name: Install website deps
        run: cd website && npm ci

      - name: Build website
        run: cd website && npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: CDK deploy
        run: cd infra && npx cdk deploy --require-approval never --outputs-file ../cdk-outputs.json

      - name: Build and push agent image
        run: |
          cd agent
          docker build --platform linux/amd64 -t ${{ env.ECR_REPO }} .
          docker tag ${{ env.ECR_REPO }}:latest ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}:latest
          docker tag ${{ env.ECR_REPO }}:latest ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}:latest
          docker push ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}

      - name: Build and push review agent image
        run: |
          cd agent
          docker build --platform linux/amd64 -f Dockerfile.review -t github-agent-review .
          docker tag github-agent-review:latest ${{ steps.ecr-login.outputs.registry }}/github-agent-review:latest
          docker tag github-agent-review:latest ${{ steps.ecr-login.outputs.registry }}/github-agent-review:${{ github.sha }}
          docker push ${{ steps.ecr-login.outputs.registry }}/github-agent-review:latest
          docker push ${{ steps.ecr-login.outputs.registry }}/github-agent-review:${{ github.sha }}
