name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
            agent/package-lock.json
            website/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Validate infra
        run: |
          cd infra
          npm ci
          npm run build
          npm test

      - name: Validate agent shell scripts
        run: |
          cd agent
          npm ci
          npm run build
          bash -n entrypoint.sh
          bash -n review-entrypoint.sh
          bash -n lib/common.sh
          bash -n lib/orchestrate-lint.sh
          bash -n lib/lint-loop.sh

      - name: Check pinned Codex sandbox on Linux
        run: |
          codex_version=$(sed -n 's/^ARG CODEX_CLI_VERSION=//p' agent/Dockerfile)
          test -n "$codex_version"
          npm install --prefix "$RUNNER_TEMP/codex-sandbox" --no-save --ignore-scripts "@openai/codex@$codex_version"
          export PATH="$RUNNER_TEMP/codex-sandbox/node_modules/.bin:$PATH"
          export CODEX_HOME="$RUNNER_TEMP/codex-home"
          source agent/lib/common.sh
          configure_codex_openrouter task
          check_codex_task_sandbox

      - name: Build website
        run: |
          cd website
          npm ci
          npm run build
